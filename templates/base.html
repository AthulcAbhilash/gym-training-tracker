<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Workout Tracker{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="App logo" class="brand-logo" />
      <div>
        <h1 class="brand-title">Gym Workout Tracker</h1>
      </div>
    </div>
    <nav class="nav">
      <a href="{{ url_for('dashboard_page') }}">Dashboard</a>
      <a href="{{ url_for('workout_day_selection_page') }}">Workout</a>
      <a href="{{ url_for('exercises_page') }}">Exercises</a>
      <a href="{{ url_for('history_page') }}">History</a>
      <a href="{{ url_for('progress_page') }}">Progress</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer"></footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block script %}{% endblock %}
</body>
</html>
